<script>
/* ============================================================
   游戏本体
   ============================================================ */

/* ---------- 开工前先看看字库是不是被改坏了 ----------
   为什么要有这一段：字库写在上面**另一个**代码块里。
   如果那里有语法错（最常见的三种：中文引号 “ ” / 少了逗号 / 模板注释没删干净），
   浏览器会把那整块跳过，于是「全部课程」根本不存在——
   页面会变成一片空白，而且控制台经常什么都不说。
   新手遇到这个只会觉得"游戏坏了"。这里兜住它，直接把话讲明白。 */
(function 检查字库() {
  const 出错 = (原因) => {
    document.body.innerHTML =
      '<div style="max-width:520px;margin:12vh auto;padding:24px;font:16px/1.7 -apple-system,sans-serif;color:#26221E">' +
      '<div style="font-size:44px;text-align:center">🔧</div>' +
      '<h2 style="color:#C4462F;text-align:center;margin:12px 0 20px">字库改坏了，游戏打不开</h2>' +
      '<p><b>问题：</b>' + 原因 + '</p>' +
      '<p><b>照这个顺序检查文件最上面那段「字库」：</b></p>' +
      '<ol style="padding-left:20px">' +
      '<li>引号是不是打成了中文的 <b>“ ”</b>？必须是英文的 <b>" "</b>（最常见）</li>' +
      '<li>每一行末尾的<b>逗号</b>是不是漏了？</li>' +
      '<li>加新课时，模板外面的<b>注释符号</b>（<b>/*</b> 和 <b>*/</b>）删干净了吗？</li>' +
      '<li>每一段 <b>{ }</b> 之间有没有用逗号隔开？</li>' +
      '</ol>' +
      '<p style="color:#5C554D;font-size:14px">改好保存，刷新页面就行。改之前建议先复制一份备份。</p>' +
      '</div>';
    throw new Error('字库未通过检查：' + 原因);
  };

  if (typeof 全部课程 === 'undefined')  出错('整段字库都没能读进来，说明里面有语法错误。');
  if (!Array.isArray(全部课程))          出错('「全部课程」不是一个清单，最外层的方括号 [ ] 可能弄丢了。');
  if (全部课程.length === 0)             出错('字库里一课都没有。');

  全部课程.forEach((课, i) => {
    const 第几课 = '第 ' + (i + 1) + ' 段课程';
    if (!课 || typeof 课 !== 'object')        出错(第几课 + ' 格式不对。');
    if (!课.课名)                              出错(第几课 + ' 少了「课名」。');
    if (!Array.isArray(课.生字) || !课.生字.length) 出错('《' + (课.课名 || 第几课) + '》没有生字。');
    课.生字.forEach((项, j) => {
      if (!项 || !项.字 || !项.拼音)
        出错('《' + 课.课名 + '》第 ' + (j + 1) + ' 个生字缺了「字」或「拼音」。');
      // 「配」可以不写（那个字就不进组词模式）；写了就必须是两个字
      if (项.配 !== undefined &&
          (!Array.isArray(项.配) || 项.配.length !== 2 || !项.配[0] || !项.配[1]))
        出错('《' + 课.课名 + '》「' + 项.字 + '」的「配」要写成两个字，'
             + '像 配: ["书","包"] 这样。不想让它出现在组词里，就整个不写「配」。');
    });
  });
})();

/* ---------- 小工具 ---------- */
const $  = (id) => document.getElementById(id);

/* 判对错时，把「上面的字」和「下面的字」拼成一个 key 去查表。
   中间垫这个分隔符，避免「果+皮」和「果皮+空」被当成同一种搭配。
   \u0000 是个绝不会出现在汉字或拼音里的字符。
   ⚠️ 建表和判定必须用同一个值——所以写成常量。
   （这里踩过坑：两处各写各的，一处是空字符一处是空格，结果每一对都判错。） */
const 分隔符 = '\u0000';

/* 洗牌：把数组顺序打乱。
   用的是 Fisher-Yates 算法 —— 从后往前，每个位置随机跟前面某个位置换一下。
   为什么不用 sort(() => Math.random()-0.5)？那种写法看着简单但打乱得不均匀，
   有些顺序出现的概率会明显偏高，孩子多玩几次就会觉得"怎么老是这样"。 */
function 洗牌(数组) {
  const a = 数组.slice();                      // 复制一份，不改原数组
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 把题目分成几轮。
   为什么不直接按「每轮 5 对」硬切？因为 6 个字会切成 5+1，
   第二轮孤零零只剩一对，孩子会觉得莫名其妙。
   这里先算要几轮，再把题目尽量平均分：6 个 → 3+3，9 个 → 5+4，12 个 → 4+4+4。 */
function 分轮(数组, 理想每轮) {
  if (数组.length <= 理想每轮) return [数组];
  const 轮数 = Math.ceil(数组.length / 理想每轮);
  const 每轮 = Math.ceil(数组.length / 轮数);
  const 结果 = [];
  for (let i = 0; i < 数组.length; i += 每轮) 结果.push(数组.slice(i, i + 每轮));
  return 结果;
}

function 切页(页面id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(页面id).classList.add('active');
  window.scrollTo(0, 0);
}


/* ============================================================
   身份：从网址里读，不从手机里读
   ------------------------------------------------------------
   网址后面加 ?kids=amy,leo 就表示这台手机上有两个孩子。
   为什么身份要写在网址里、而不是让孩子第一次输名字存起来？
   因为一家两个孩子共用一台手机时，存在手机里的身份会互相覆盖。
   写在网址里，每次玩都是现读，两个孩子各是各的。
   ============================================================ */
const 参数 = new URLSearchParams(location.search);
const 名单 = (参数.get('kids') || 参数.get('s') || '小朋友')
  .split(',').map(s => s.trim()).filter(Boolean);

/* ------------------------------------------------------------
   玩哪一课：链接里写 &课=2 就是第 2 课。
   不写的话自动打开**最新的一课**（清单里最后那段），
   所以每周加完新课，老链接自然就指向新课了，不用重新发。
   ------------------------------------------------------------ */
const 课号参数 = parseInt(参数.get('课') || 参数.get('lesson') || '', 10);

/* 不写课号时默认打开哪一课：最后一个**不是复习合集**的课。
   为什么不直接用最后一课？因为复习合集排在列表末尾，
   直接用最后一课的话，孩子每次进来玩的就变成复习合集，而不是本周新课了。 */
const 默认课索引 = (() => {
  for (let i = 全部课程.length - 1; i >= 0; i--) {
    if (!全部课程[i].复习合集) return i;
  }
  return 全部课程.length - 1;
})();

let 当前课索引 =
  (Number.isInteger(课号参数) && 课号参数 >= 1 && 课号参数 <= 全部课程.length)
    ? 课号参数 - 1
    : 默认课索引;

let 字库 = 全部课程[当前课索引];

/* 给每个孩子一个固定颜色，视觉上一眼区分，防止点错人 */
const 颜色表 = ['#E8734A', '#2F5D50', '#F2B233', '#3E8E5A', '#7B5EA7', '#C4462F'];
const 取颜色 = (i) => 颜色表[i % 颜色表.length];

let 当前学生 = null;


/* ============================================================
   本地存档
   ------------------------------------------------------------
   ⚠️ 两个关键点：
   1. 存档的名字里带学生代号（xxl_amy / xxl_leo），
      这样同一台手机上两个孩子各存各的，不会互相覆盖。
      浏览器的存储是按"网站"分的，不按网址参数分 —— 所以必须自己把代号拼进去。
   2. 所有读写都包在 try 里。iOS 的无痕模式下访问存储会直接报错，
      不包起来的话整个游戏会白屏。存不上没关系，游戏照样能玩。
   ============================================================ */
const 存档名 = (学生) => 'mengya_xxl_' + 学生;

/* 先探一下这台设备到底让不让存。
   ⚠️ 直接双击打开文件（网址是 file://）时，浏览器认为这个页面"来路不明"，
   会拒绝给它存储空间 —— 这不是代码坏了，上线成网址之后就正常。
   iOS 的无痕模式也会这样。探出来存不了就在首页说一声，免得你以为游戏出问题了。 */
const 存储可用 = (() => {
  try {
    localStorage.setItem('__试写__', '1');
    localStorage.removeItem('__试写__');
    return true;
  } catch (e) {
    return false;
  }
})();

function 读存档(学生) {
  try {
    const 原文 = localStorage.getItem(存档名(学生));
    return 原文 ? JSON.parse(原文) : { 学生, 记录: [] };
  } catch (e) {
    return { 学生, 记录: [] };
  }
}

function 写存档(学生, 一局) {
  try {
    const 存档 = 读存档(学生);
    存档.记录.push(一局);
    // 只留最近 100 局，免得存储越撑越大
    if (存档.记录.length > 100) 存档.记录 = 存档.记录.slice(-100);
    localStorage.setItem(存档名(学生), JSON.stringify(存档));
  } catch (e) {
    /* 存不上就算了，不影响玩 —— 数据主要走表格 */
  }
}

/* 把某一局标记成「已经寄出去了」，下次就不再补寄。
   用「时间」当身份证：它精确到毫秒，同一个孩子不可能有两局时间一样。 */
function 标记已寄(学生, 时间) {
  try {
    const 存档 = 读存档(学生);
    const 那条 = 存档.记录.find(r => r.时间 === 时间);
    if (那条) {
      那条.已寄 = true;
      localStorage.setItem(存档名(学生), JSON.stringify(存档));
    }
  } catch (e) { /* 存不上无所谓，最多下次多寄一条重复的 */ }
}


/* ============================================================
   把一局的成绩寄到 Google 表格
   ------------------------------------------------------------
   ⚠️ 这里有个绕不开的限制，得讲清楚：
   Google 表单不允许网页读取它的回应，所以我们只能「闷头寄信」
   （技术上叫 no-cors）——信寄出去了，但**收不到回执**，
   代码没法知道表格到底收没收到。

   所以策略是：
   1. 先存本地（保证不丢），再寄
   2. 寄的动作没报错 = 大概率成功 → 标记「已寄」
   3. 报错了（没网、飞行模式）= 肯定没成功 → 留着，下次打开游戏自动补寄
   4. 万一出现「其实寄到了但被判成失败」，下次会重复寄一条 ——
      表格里会多一条一样的记录。宁可重复也不能丢，重复你一眼看得出来。
   ============================================================ */
function 寄一条(一局) {
  if (!上报配置.开关) return Promise.resolve(false);

  const 包裹 = new FormData();
  for (const 键 in 上报配置.字段) {
    let 值 = 一局[键];
    if (Array.isArray(值)) 值 = 值.join(' ');      // 错字是数组，拼成「藏 察」
    包裹.append(上报配置.字段[键], 值 == null ? '' : String(值));
  }

  return fetch(上报配置.地址, { method: 'POST', mode: 'no-cors', body: 包裹 })
    .then(() => true)
    .catch(() => false);
}

/* 开局前先看看有没有以前没寄出去的，有就补上。
   一次最多补 20 条，免得孩子攒了一堆时一下子发几十个请求。 */
function 补寄漏掉的(学生) {
  if (!上报配置.开关) return;
  try {
    const 漏掉的 = 读存档(学生).记录.filter(r => !r.已寄).slice(0, 20);
    漏掉的.forEach(一局 => {
      寄一条(一局).then(成功 => { if (成功) 标记已寄(学生, 一局.时间); });
    });
  } catch (e) { /* 补寄失败不影响玩 */ }
}


/* ============================================================
   音效
   ------------------------------------------------------------
   用浏览器自带的声音合成器现场发声，不需要任何音频文件，
   所以这个 HTML 还是能单独发出去、不依赖外部资源。
   ============================================================ */
let 音频上下文 = null;
function 响(频率, 时长 = 0.12, 音量 = 0.08) {
  try {
    if (!音频上下文) 音频上下文 = new (window.AudioContext || window.webkitAudioContext)();
    const 振荡器 = 音频上下文.createOscillator();
    const 音量器 = 音频上下文.createGain();
    振荡器.type = 'sine';
    振荡器.frequency.value = 频率;
    音量器.gain.setValueAtTime(音量, 音频上下文.currentTime);
    音量器.gain.exponentialRampToValueAtTime(0.0001, 音频上下文.currentTime + 时长);
    振荡器.connect(音量器).connect(音频上下文.destination);
    振荡器.start();
    振荡器.stop(音频上下文.currentTime + 时长);
  } catch (e) { /* 有些浏览器不给放声音，静音也能玩 */ }
}
const 对了音 = () => { 响(660); setTimeout(() => 响(880), 90); };
const 错了音 = () => 响(180, 0.18, 0.06);
const 通关音 = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => 响(f, 0.16), i * 110)); };


/* ============================================================
   一局游戏的状态
   ============================================================ */
let 局 = null;

/* 造一局。模式是 'pinyin'（汉字配拼音）或 'word'（两字组词） */
function 开一局(模式) {
  // 把题目做成统一的格式：{ 上: 显示在上面的内容, 下: 显示在下面的内容, 记错用的字 }
  let 全部题目;

  if (模式 === 'pinyin') {
    /* 复习合集有一两百个字，全摆出来要玩几十轮，孩子撑不住。
       所以合集在字库里写「每次随机抽: 12」，每次开局随机挑 12 个来玩——
       每次抽到的都不一样，正好适合反复复习。
       普通课不写这个字段，行为跟以前完全一样。 */
    let 源 = 字库.生字;
    if (字库.每次随机抽 && 字库.每次随机抽 < 源.length) {
      源 = 洗牌(源).slice(0, 字库.每次随机抽);
    }
    全部题目 = 源.map(项 => ({
      上: { 类型: 'zi', 文: 项.字 },
      下: { 类型: 'py', 文: 项.拼音 },
      字: 项.字,
      拼音: 项.拼音,
    }));
  } else {
    /* 组词题目直接从生字里拿：哪个字写了「配」，就用它那一组。
       归属不用再推断了 —— 组词写在哪个字下面，配错了就记在哪个字头上，
       所以「身体」写在「体」那一行就记「体」，一目了然。 */
    let 源 = 字库.生字.filter(项 => Array.isArray(项.配) && 项.配.length === 2);
    if (字库.每次随机抽 && 字库.每次随机抽 < 源.length) {
      源 = 洗牌(源).slice(0, 字库.每次随机抽);
    }
    全部题目 = 源.map(项 => ({
      上: { 类型: 'zi', 文: 项.配[0] },
      下: { 类型: 'zi', 文: 项.配[1] },
      字: 项.字,
      拼音: 项.拼音,        // 顺手带上，结算页「这几个字再看看」就能显示拼音了
    }));
  }

  局 = {
    模式,
    轮组: 分轮(洗牌(全部题目), 每轮对数),
    当前轮: 0,
    对: 0,
    错: 0,
    错字: {},                    // { "藏": 2 } —— 记哪个字错了几次
    开始时间: Date.now(),
    选中: null,
  };

  切页('page-play');
  画一轮();
}

function 画一轮() {
  const 题目 = 局.轮组[局.当前轮];
  局.选中 = null;
  局.本轮剩余 = 题目.length;

  /* 这一轮所有「正确的上下搭配」，按文字记下来。
     判对错时查这个表，而不是看点的是哪两张牌 —— 原因见 判定() 里的说明。
     中间那个分隔符是个普通用不到的字符，防止「果+皮」和「果皮+空」被算成同一种搭配。 */
  局.有效配对 = new Set(题目.map(t => t.上.文 + 分隔符 + t.下.文));

  $('hud-round').textContent = `第 ${局.当前轮 + 1} / ${局.轮组.length} 轮`;
  更新计分();
  提示(局.模式 === 'pinyin' ? '上面挑一个字，下面挑它的拼音' : '上下各挑一个字，连成一个词');

  const 上区 = $('zone-top');
  const 下区 = $('zone-bottom');
  上区.innerHTML = '';
  下区.innerHTML = '';

  /* 上下两区分别打乱，否则同一行就是答案，孩子不用认字也能连对 */
  洗牌(题目).forEach(t => 上区.appendChild(做牌(t, '上')));
  洗牌(题目).forEach(t => 下区.appendChild(做牌(t, '下')));
}

/* 做一张字牌 */
function 做牌(题, 位置) {
  const 内容 = 题[位置];
  const 牌 = document.createElement('button');
  牌.className = 'tile';
  牌.dataset.位置 = 位置;

  const 文 = document.createElement('span');
  文.className = 内容.类型 === 'zi' ? 'zi' : 'py';
  文.textContent = 内容.文;
  牌.appendChild(文);

  牌._题 = 题;                                    // 题目挂在元素上，记错字时要用
  牌._文 = 内容.文;                                // 这张牌上写的字（判对错看这个）
  牌.addEventListener('click', () => 点牌(牌));
  return 牌;
}

function 点牌(牌) {
  if (牌.classList.contains('done')) return;      // 已经配对好的不理

  // 还没选过东西 → 这是第一下
  if (!局.选中) {
    选中(牌);
    return;
  }

  // 点的是同一张 → 取消选中
  if (局.选中 === 牌) {
    牌.classList.remove('picked');
    局.选中 = null;
    return;
  }

  // 点的是同一区的另一张 → 换成选它
  if (局.选中.dataset.位置 === 牌.dataset.位置) {
    局.选中.classList.remove('picked');
    选中(牌);
    return;
  }

  // 一上一下，可以判对错了
  判定(局.选中, 牌);
}

function 选中(牌) {
  牌.classList.add('picked');
  局.选中 = 牌;
  响(520, 0.06, 0.05);
}

function 判定(甲, 乙) {
  /* 先分清哪张在上、哪张在下（孩子可能先点下面再点上面） */
  const 上牌 = 甲.dataset.位置 === '上' ? 甲 : 乙;
  const 下牌 = 上牌 === 甲 ? 乙 : 甲;

  /* ⚠️ 按「牌上写的字」判对错，不按「点的是哪两张牌」。
     为什么：两组词可能共用一个字（观-看 / 察-看 → 下面会有两张「看」），
     同音字在拼音模式下也一样（两张一模一样的拼音牌）。
     如果按牌的身份比对，孩子点了另一张「看」会被判错——明明答案是对的。 */
  const 对上了 = 局.有效配对.has(上牌._文 + 分隔符 + 下牌._文);

  甲.classList.remove('picked');
  局.选中 = null;

  if (对上了) {
    局.对++;
    对了音();
    提示(挑一句(['对啦！', '很好！', '就是它！', '厉害 👍']), 'hit');
    [甲, 乙].forEach(牌 => {
      牌.classList.add('done');
      // 先变绿让孩子看清对上了，再淡出。位置留着，其它牌不会乱跳
      setTimeout(() => 牌.classList.add('gone'), 420);
    });

    局.本轮剩余--;
    if (局.本轮剩余 === 0) {
      setTimeout(下一轮, 750);
    }
  } else {
    局.错++;
    错了音();
    // 记错字：算在上面那张牌对应的生字上，因为孩子是从字出发去找搭档的
    const 错的字 = 上牌._题.字;
    局.错字[错的字] = (局.错字[错的字] || 0) + 1;

    提示(挑一句(['再想想～', '不是这个哦', '换一个试试']), 'miss');
    [甲, 乙].forEach(牌 => {
      牌.classList.add('bad');
      setTimeout(() => 牌.classList.remove('bad'), 320);
    });
  }
  更新计分();
}

const 挑一句 = (arr) => arr[Math.floor(Math.random() * arr.length)];

function 提示(文字, 类 = '') {
  const p = $('prompt');
  p.textContent = 文字;
  p.className = 'prompt ' + 类;
}

function 更新计分() {
  $('hud-score').innerHTML = `✅ ${局.对} &nbsp; <span class="wrong">❌ ${局.错}</span>`;
}

function 下一轮() {
  局.当前轮++;
  if (局.当前轮 < 局.轮组.length) {
    画一轮();
  } else {
    结算();
  }
}


/* ============================================================
   结算
   ============================================================ */
function 结算() {
  const 用时秒 = Math.round((Date.now() - 局.开始时间) / 1000);
  const 总题数 = 局.对;
  const 正确率 = 总题数 + 局.错 > 0 ? Math.round(总题数 / (总题数 + 局.错) * 100) : 100;

  /* 这一局的完整记录。
     第 4 步接 Google 表单时，直接把这个对象寄出去就行，
     所以现在就把字段定好，免得到时候再改一遍游戏。 */
  const 一局 = {
    学生:   当前学生.代号,
    时间:   new Date().toISOString(),
    课:     字库.课名,
    模式:   局.模式 === 'pinyin' ? '汉字配拼音' : '两字组词',
    对:     局.对,
    错:     局.错,
    正确率: 正确率,
    错字:   Object.keys(局.错字),
    用时秒: 用时秒,
  };
  // 先存本地（保证不丢），再寄出去。寄的过程是后台进行的，不挡孩子看结算页
  写存档(当前学生.代号, 一局);
  寄一条(一局).then(成功 => { if (成功) 标记已寄(当前学生.代号, 一局.时间); });

  通关音();

  // 按正确率给不同的反馈，但不打分、不排名 —— 只说这一局怎么样
  let emoji, 话;
  if (局.错 === 0)      { emoji = '🏆'; 话 = '全对！一个都没错！'; }
  else if (正确率 >= 80){ emoji = '🌟'; 话 = '很不错！'; }
  else if (正确率 >= 60){ emoji = '💪'; 话 = '完成啦，再练一次会更快'; }
  else                  { emoji = '🌱'; 话 = '玩完啦，这几个字有点难'; }

  $('done-emoji').textContent = emoji;
  $('done-line').textContent  = 话;
  $('stat-right').textContent = 局.对;
  $('stat-wrong').textContent = 局.错;
  $('stat-time').textContent  = 用时秒;

  // 错的字列出来，带拼音，让孩子当场再看一眼
  const 错字列表 = Object.keys(局.错字);
  if (错字列表.length > 0) {
    const 容器 = $('review-list');
    容器.innerHTML = '';
    错字列表.forEach(字 => {
      const 条目 = 字库.生字.find(项 => 项.字 === 字);
      const div = document.createElement('div');
      div.className = 'zi-item';
      div.innerHTML = `<div class="z"></div><div class="p"></div>`;
      div.querySelector('.z').textContent = 字;
      div.querySelector('.p').textContent = 条目 ? 条目.拼音 : '';
      容器.appendChild(div);
    });
    $('review').style.display = '';
  } else {
    $('review').style.display = 'none';
  }

  切页('page-done');
}


/* ============================================================
   启动
   ============================================================ */
function 进主菜单(学生) {
  当前学生 = 学生;

  // 上次没寄出去的（比如当时没网），趁现在补上
  补寄漏掉的(学生.代号);
  $('hello-name').textContent = 学生.显示名;
  $('hello-name').style.color = 学生.颜色;

  // 复习合集字很多，每次只随机抽一部分玩，所以说明写法不一样
  $('menu-lesson').textContent = 字库.课名 + ' · ' + (字库.每次随机抽
    ? '每次随机 ' + 字库.每次随机抽 + ' 个字（共 ' + 字库.生字.length + ' 字）'
    : '共 ' + 字库.生字.length + ' 个字');

  // 只有一课时，课名条变成纯展示，不显示「换一课」也点不动
  const 多课 = 全部课程.length > 1;
  $('chip-arrow').style.display = 多课 ? '' : 'none';
  $('btn-lesson').classList.toggle('only-one', !多课);

  // 没配组词的课（比如复习合集），直接把「两字组词」这个入口藏起来，
  // 否则点进去是一片空白，孩子会以为坏了
  const 有组词 = 字库.生字.some(项 => Array.isArray(项.配));
  document.querySelector('.mode-btn[data-mode="word"]').style.display = 有组词 ? '' : 'none';

  // 一台手机上有好几个孩子时，菜单页才给「换个人玩」的入口
  $('btn-switch').style.display = 名单.length > 1 ? '' : 'none';

  const 存档 = 读存档(学生.代号);
  $('menu-footnote').textContent =
    !存储可用            ? '（这台设备不记录游戏次数）'
    : 存档.记录.length   ? `你已经玩过 ${存档.记录.length} 次啦`
    : '';

  切页('page-menu');
}

/* 选课页：把所有课列出来，点哪课换哪课 */
function 画课程列表() {
  const 列表 = $('lesson-list');
  列表.innerHTML = '';
  全部课程.forEach((课, i) => {
    const b = document.createElement('button');
    b.className = 'who-btn lesson' + (i === 当前课索引 ? ' current' : '');
    b.textContent = 课.课名;
    b.addEventListener('click', () => {
      当前课索引 = i;
      字库 = 全部课程[i];              // 换课就是换字库，别的都不用动
      进主菜单(当前学生);
    });
    列表.appendChild(b);
  });
  切页('page-lesson');
}

function 启动() {
  const 学生们 = 名单.map((代号, i) => ({
    代号,
    // 显示时首字母大写，看起来像名字而不是代码
    显示名: 代号.charAt(0).toUpperCase() + 代号.slice(1),
    颜色: 取颜色(i),
  }));

  if (学生们.length === 1) {
    进主菜单(学生们[0]);                          // 只有一个孩子，跳过选人
  } else {
    const 列表 = $('who-list');
    列表.innerHTML = '';
    学生们.forEach(学生 => {
      const b = document.createElement('button');
      b.className = 'who-btn';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = 学生.颜色;
      b.appendChild(dot);
      b.appendChild(document.createTextNode('我是 ' + 学生.显示名));
      b.addEventListener('click', () => 进主菜单(学生));
      列表.appendChild(b);
    });
    切页('page-who');
  }
}

/* ---------- 按钮接线 ---------- */
document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => 开一局(b.dataset.mode));
});
$('btn-quit').addEventListener('click',  () => 切页('page-menu'));
$('btn-switch').addEventListener('click',() => 切页('page-who'));
$('btn-lesson').addEventListener('click', 画课程列表);
$('btn-lesson-back').addEventListener('click', () => 进主菜单(当前学生));
$('btn-again').addEventListener('click', () => 开一局(局.模式));
$('btn-back').addEventListener('click',  () => 进主菜单(当前学生));

启动();
</script>
