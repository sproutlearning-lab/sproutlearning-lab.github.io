.row{display:flex;align-items:flex-start;gap:12px;padding:12px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.row:last-child{border-bottom:none;}
.row .zi{font-family:var(--font-hanzi);font-size:34px;line-height:1;width:46px;text-align:center;flex-shrink:0;}
.row .py{flex-shrink:0;min-width:118px;}
.row .py select,.row .py input{width:100%;padding:7px 8px;border:2px solid var(--border);
border-radius:9px;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--accent);background:#fff;}
.row.duo .py select{border-color:var(--accent-2);background:#FFF8E6;}
.row .duo-tip{font-size:11px;color:#A5750B;margin-top:3px;font-weight:700;}
.row .pei{flex:1;min-width:230px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.pei-btn{border:2px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;
font-family:var(--font-hanzi);font-size:17px;cursor:pointer;color:var(--text);}
.pei-btn:hover{border-color:var(--accent);}
.pei-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.pei-btn.none{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--text-2);}
.pei-in{width:104px;padding:6px 9px;border:2px solid var(--border);border-radius:9px;
font-family:var(--font-hanzi);font-size:16px;}
.pei-warn{font-size:11px;color:var(--warn);font-weight:700;width:100%;}

.btn{border:none;border-radius:14px;padding:13px 20px;font-family:var(--font-body);
font-size:15px;font-weight:700;color:#fff;background:var(--primary);cursor:pointer;
box-shadow:0 3px 0 rgba(0,0,0,.15);}
.btn:active{transform:translateY(3px);box-shadow:none;}
.btn.big{background:var(--accent);font-size:17px;padding:15px 28px;}
.btn.ghost{background:transparent;color:var(--text-2);box-shadow:none;border:3px solid var(--border);padding:10px 17px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;}
.msg{color:var(--ok);font-weight:700;font-size:13px;}

.out{margin-top:16px;}
.out textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.65;min-height:220px;}
.tip{background:var(--bg-soft);border-radius:12px;padding:13px 15px;font-size:13px;
color:var(--text-2);line-height:1.75;margin-top:14px;}
.tip b{color:var(--text);}
.empty{color:var(--text-2);font-size:14px;padding:14px 2px;}
.count{font-size:13px;color:var(--text-2);margin-top:10px;}
</style>

<div class="app">
  <h1>字库编辑器</h1>
  <p class="sub">只输入汉字，拼音和组词自动配好，生成能直接粘进 <b>hanzi.html</b> 的代码。<br>
     引号、逗号、括号都由程序生成，中文输入法的坑碰不到。</p>

  <div class="field">
    <label>课名（显示在游戏首页）</label>
    <input type="text" id="kename" placeholder="例：种子去旅行 · 第 3 课">
  </div>

  <div class="field">
    <label>这节课的字（粘一串就行，标点空格自动忽略）</label>
    <textarea id="zi" placeholder="例：图贴写标名比最条页　（这行是提示，直接在这里打字或粘贴）" autofocus></textarea>
  </div>

  <div class="rows" id="rows"><p class="empty">上面输入汉字后，这里会出现每个字的拼音和组词选项。</p></div>
  <p class="count" id="count"></p>

  <div class="btn-row">
    <button class="btn big" id="gen">生成代码</button>
    <span class="msg" id="msg"></span>
  </div>

  <div class="out" id="outwrap" style="display:none">
    <textarea id="out" readonly></textarea>
    <div class="btn-row">
      <button class="btn" id="copy">复制</button>
      <button class="btn ghost" id="openrepo">去 GitHub 粘贴</button>
    </div>
    <div class="tip">
      <b>粘到哪里</b>：打开 <code>hanzi.html</code> 的编辑页 → <code>Cmd+F</code> 搜 <code>复习合集</code> →
      粘在<b>最后一课的 <code>},</code> 后面、复习合集那段注释前面</b> → 拉到底 Commit。<br>
      <b>怎么确认成了</b>：等一两分钟，打开游戏首页，课名条上应该显示你刚加的这一课。
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const 取汉字 = s => (s.match(/[一-鿿]/g) || []);

/* ---------- 把内嵌数据解析成查得快的结构 ---------- */
const 拼音表 = new Map();
数据.拼音串.split(' ').forEach(seg => {
  const i = seg.indexOf('|');
  if (i > 0) 拼音表.set(seg.slice(0, i), seg.slice(i + 1).split('/'));
});
/* 词串是「每两个字一个词」拼起来的，按词频从高到低 */
const 词表 = [];
for (let i = 0; i + 1 < 数据.词串.length; i += 2) 词表.push(数据.词串.slice(i, i + 2));
const 优先池 = new Set([...数据.已学, ...数据.启蒙]);   // 已教过 / 启蒙字，当搭档最合适
const 高亮多音 = new Set(数据.高亮多音);
/* 词音表：多音字在某个词里到底读什么。
   键是「词+字」，比如 "漂亮漂" → "piào"。
   有了它，选了读音就只显示那个读音的词，不会出现「漂 piāo」配「漂亮」这种自相矛盾。 */
const 词音表 = new Map();
数据.词音串.split(' ').forEach(seg => {
  const i = seg.indexOf('|');
  if (i > 0) 词音表.set(seg.slice(0, i), seg.slice(i + 1));
});

/* 建索引：字 → 包含它的词（按词频顺序，词表本身就是排好的） */
const 词索引 = new Map();
词表.forEach(w => {
  for (const c of new Set(w)) {
    if (!词索引.has(c)) 词索引.set(c, []);
    词索引.get(c).push(w);
  }
});

/* ---------- 给某个字找「配」的候选 ----------
   规则跟手册一致：搭档字要比生字简单。
   排序：搭档字在「已学/启蒙」池里的排前面，其余按词频。 */
function 找候选(字, 读音) {
  const 词们 = 词索引.get(字) || [];
  const 好 = [], 一般 = [];
  for (const w of 词们) {
    const 搭 = w[0] === 字 ? w[1] : w[0];
    if (搭 === 字) continue;                      // 叠字（爷爷）留到最后再说
    /* ⚠️ 读音过滤：多音字选了哪个音，就只留那个音的词。
       否则「漂」定成 piāo（漂浮）却推荐「漂亮」(piào)，字库里就自相矛盾了。
       词音表里查不到的词不过滤（说明这个字在这个词里没有歧义）。 */
    if (读音) {
      const 该词读音 = 词音表.get(w + 字);
      if (该词读音 && 该词读音 !== 读音) continue;
    }
    (优先池.has(搭) ? 好 : 一般).push(w);
    if (好.length >= 5) break;
  }
  return [...好, ...一般].slice(0, 5);
}

let 状态 = [];   // [{字, 音们, 选中音, 配, 自定义}]

function 建行() {
  const 字们 = [...new Set(取汉字($('zi').value))];
  // 保留已填过的选择，避免重新输入时前功尽弃
  const 旧 = new Map(状态.map(s => [s.字, s]));
  状态 = 字们.map(z => {
    if (旧.has(z)) return 旧.get(z);
    const 音们 = 拼音表.get(z) || [];
    const 选中音 = 音们[0] || '';
    const 候选 = 找候选(z, 选中音);
    return { 字: z, 音们, 选中音, 候选, 配: 候选[0] || '' };
  });

  const 容器 = $('rows');
  容器.innerHTML = '';
  if (!状态.length) {
    容器.innerHTML = '<p class="empty">上面输入汉字后，这里会出现每个字的拼音和组词选项。</p>';
    $('count').textContent = '';
    return;
  }

  状态.forEach((s, idx) => {
    const 行 = document.createElement('div');
    行.className = 'row' + (高亮多音.has(s.字) ? ' duo' : '');

    const zi = document.createElement('div');
    zi.className = 'zi'; zi.textContent = s.字;
    行.appendChild(zi);

    // ---- 拼音 ----
    const py = document.createElement('div');
    py.className = 'py';
    if (s.音们.length > 1) {
      const sel = document.createElement('select');
      s.音们.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m; if (m === s.选中音) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', e => {
        s.选中音 = e.target.value;
        // 读音变了，配词候选要跟着换（漂 piāo 和 piào 是两批词）
        s.候选 = 找候选(s.字, s.选中音);
        if (!s.自定义) s.配 = s.候选[0] || '';
        建行();
      });
      py.appendChild(sel);
      if (高亮多音.has(s.字)) {
        const t = document.createElement('div');
        t.className = 'duo-tip'; t.textContent = '⚠️ 多音字，确认读音';
        py.appendChild(t);
      }
    } else {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = s.选中音 || '';
      inp.placeholder = s.选中音 ? '' : '字库里没有，手填';
      inp.addEventListener('input', e => { s.选中音 = e.target.value.trim(); });
      py.appendChild(inp);
    }
    行.appendChild(py);

    // ---- 配 ----
    const pei = document.createElement('div');
    pei.className = 'pei';
    const 画按钮 = () => {
      pei.innerHTML = '';
      s.候选.forEach(w => {
        const b = document.createElement('button');
        b.className = 'pei-btn' + (s.配 === w && !s.自定义 ? ' on' : '');
        b.textContent = w;
        b.addEventListener('click', () => { s.配 = w; s.自定义 = false; 画按钮(); });
        pei.appendChild(b);
      });
      const 无 = document.createElement('button');
      无.className = 'pei-btn none' + (s.配 === '' ? ' on' : '');
      无.textContent = '不配组词';
      无.addEventListener('click', () => { s.配 = ''; s.自定义 = false; 画按钮(); });
      pei.appendChild(无);

      const inp = document.createElement('input');
      inp.className = 'pei-in'; inp.placeholder = '自己填';
      inp.value = s.自定义 ? s.配 : '';
      inp.addEventListener('input', e => {
        const v = 取汉字(e.target.value).join('');
        s.配 = v; s.自定义 = true;
        pei.querySelectorAll('.pei-btn').forEach(b => b.classList.remove('on'));
        const 坏 = pei.querySelector('.pei-warn');
        if (坏) 坏.remove();
        if (v.length && v.length !== 2) {
          const w = document.createElement('div');
          w.className = 'pei-warn'; w.textContent = '组词要正好两个字';
          pei.appendChild(w);
        } else if (v.length === 2 && !v.includes(s.字)) {
          const w = document.createElement('div');
          w.className = 'pei-warn'; w.textContent = '这个词里没有「' + s.字 + '」，确认一下';
          pei.appendChild(w);
        }
      });
      pei.appendChild(inp);
      if (!s.候选.length && !s.自定义) {
        const w = document.createElement('div');
        w.className = 'pei-warn'; w.textContent = '没找到合适的搭档，自己填或者选「不配组词」';
        pei.appendChild(w);
      }
    };
    画按钮();
    行.appendChild(pei);

    容器.appendChild(行);
  });

  const 多音数 = 状态.filter(s => 高亮多音.has(s.字)).length;
  $('count').textContent = '共 ' + 状态.length + ' 个字'
    + (多音数 ? '，其中 ' + 多音数 + ' 个多音字请确认读音（黄框那几行）' : '');
}
$('zi').addEventListener('input', 建行);

/* ---------- 生成代码 ---------- */
function 宽(s) { let n = 0; for (const c of s) n += c.charCodeAt(0) > 0x2E80 ? 2 : 1; return n; }
function 垫(s, n) { return s + ' '.repeat(Math.max(0, n - 宽(s))); }

$('gen').addEventListener('click', () => {
  if (!状态.length) { $('msg').textContent = '先输入汉字'; return; }
  const 缺音 = 状态.filter(s => !s.选中音);
  if (缺音.length) {
    $('msg').textContent = '这些字还没填拼音：' + 缺音.map(s => s.字).join(' ');
    return;
  }
  const 课名 = $('kename').value.trim() || '未命名的一课';

  const pw = Math.max(...状态.map(s => 宽('"' + s.选中音 + '",')));
  const cw = Math.max(...状态.map(s => 宽('"' + s.配 + '",')), 4);

  const 行们 = 状态.map(s => {
    let t = '      { 字: "' + s.字 + '", 拼音: ' + 垫('"' + s.选中音 + '",', pw + 1);
    if (s.配) {
      t += ' 词: ' + 垫('"' + s.配 + '",', cw + 1);
      t += ' 配: ["' + s.配[0] + '","' + s.配[1] + '"]';
    } else {
      t = t.replace(/,\s*$/, '');
    }
    return t.replace(/\s+$/, '').replace(/,$/, '') + ' },';
  });

  const 代码 =
    '  /* ========== ' + 课名 + ' ========== */\n' +
    '  {\n' +
    '    课名: "' + 课名 + '",\n\n' +
    '    生字: [\n' + 行们.join('\n') + '\n' +
    '    ],\n' +
    '  },';

  $('outwrap').style.display = '';
  $('out').value = 代码;
  const 无配 = 状态.filter(s => !s.配).map(s => s.字);
  $('msg').textContent = '生成了 ' + 状态.length + ' 个字'
    + (无配.length ? '（' + 无配.join(' ') + ' 没配组词，只会出现在拼音模式）' : '');
  $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('out').value);
    $('msg').textContent = '已复制，去 hanzi.html 粘贴';
  } catch (e) {
    const t = $('out');
    t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0, 999999);
    t.setAttribute('readonly', '');
    $('msg').textContent = '已全选，按 Cmd+C 复制';
  }
});

$('openrepo').addEventListener('click', () => {
  window.open('https://github.com/sproutlearning-lab/sproutlearning-lab.github.io/edit/main/hanzi.html', '_blank');
});

建行();
</script>
